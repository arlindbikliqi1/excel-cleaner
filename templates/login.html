<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Hyrje - Excel Cleaner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
  <div class="login-page">
    <div class="login-card card border-0">
      <div class="card-body">
        <div class="login-brand">
          <div class="brand-mark"><i class="fas fa-table-cells"></i></div>
          <h1 class="h4 fw-bold mb-1">Excel Cleaner</h1>
          <p class="text-muted small mb-0">Hyr në panelin e administratorit</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} py-2 small mb-3">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="post" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Përdoruesi</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
              <input type="text" class="form-control border-start-0" name="username" required autofocus placeholder="admin">
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold">Fjalëkalimi</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
              <input type="password" class="form-control border-start-0" name="password" required placeholder="••••••••">
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">
            <i class="fas fa-arrow-right-to-bracket me-2"></i>Hyr në sistem
          </button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
